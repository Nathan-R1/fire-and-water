<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14121f">
  <title>Fire &amp; Water</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <span id="status">Connecting…</span>
    <span id="rotate">↻ Rotate for a bigger view</span>
    <span class="hud-right">
      <button id="fullscreen" type="button" hidden aria-label="Fullscreen">⛶</button>
      <button id="share" type="button">Room <b id="code">----</b> · Share</button>
    </span>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
  </main>

  <div id="controls" hidden>
    <div id="dpad" aria-label="Move">
      <span class="ctl" data-dir="-1">◀</span>
      <span class="ctl" data-dir="1">▶</span>
    </div>
    <button id="jump" class="ctl" type="button" aria-label="Jump">▲</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/physics.js"></script>
  <script src="client.js"></script>
</body>
</html>
