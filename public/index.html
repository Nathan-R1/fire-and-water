<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14121f">
  <title>Fire &amp; Water</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <span id="status">Connecting…</span>
    <button id="share" type="button">Room <b id="code">----</b> · Share</button>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
  </main>

  <nav id="controls" hidden>
    <button class="ctl" data-dir="-1" aria-label="Move left">◀</button>
    <button class="ctl" data-dir="1" aria-label="Move right">▶</button>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
